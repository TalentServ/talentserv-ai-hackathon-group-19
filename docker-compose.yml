version: '3.8'

services:
  travelmind:
    build: .
    container_name: travelmind-mcp
    ports:
      - "8000:8000"
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
      - REPORTS_DIR=reports
      - CHARTS_DIR=charts
    volumes:
      - ./reports:/app/reports
      - ./charts:/app/charts
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
